# GitHub Actions CI workflow for building and testing NEP with legacy PDB
# reader support.
#
# V3.3.0 Sprint 1: no-op PDB dispatch layer infrastructure.
#
# This workflow builds NEP with NEP_ENABLE_PDB=ON using:
# - HDF5 2.1.1 (built from source, cached)
# - NetCDF-C 4.10.1 (built from source, cached)
# - NetCDF-Fortran (built from source, cached)
#
# No external parsing library is required for the legacy PDB reader.
#
# Local build (dev environment): HDF5 2.1.1 is installed at
# /usr/local/hdf5-2.1.1 and NetCDF-C (main, >=4.10.1) at
# /usr/local/netcdf-c. Build with:
#   export LD_LIBRARY_PATH=/usr/local/hdf5-2.1.1/lib:/usr/local/netcdf-c/lib:$LD_LIBRARY_PATH
#   export PKG_CONFIG_PATH=/usr/local/netcdf-c/lib/pkgconfig:/usr/local/hdf5-2.1.1/lib/pkgconfig:$PKG_CONFIG_PATH
#   rm -rf build && mkdir build && cd build
#   cmake .. -DCMAKE_PREFIX_PATH="/usr/local/hdf5-2.1.1;/usr/local/netcdf-c" \
#       -DNEP_ENABLE_PDB=ON -DBUILD_TESTING=ON
#   make -j$(nproc) && ctest --verbose
#
# Edward Hartnett, Intelligent Data Design, Inc.
name: ci_pdb

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pdb-build:
    name: PDB Build (CMake)
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/hdf5-install/lib:${{ github.workspace }}/netcdf-c-install/lib:${{ github.workspace }}/netcdf-fortran-install/lib
      PKG_CONFIG_PATH: ${{ github.workspace }}/netcdf-c-install/lib/pkgconfig:${{ github.workspace }}/hdf5-install/lib/pkgconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make wget zlib1g-dev pkg-config gfortran libzstd-dev

      - name: Cache HDF5 install
        id: cache-hdf5-pdb
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/hdf5-install
          key: hdf5-2.1.1-pdb-${{ runner.os }}-refresh-1

      - name: Download and build HDF5 2.1.1
        if: steps.cache-hdf5-pdb.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/2.1.1.tar.gz -O hdf5-2.1.1.tar.gz
          tar -xzf hdf5-2.1.1.tar.gz
          cd hdf5-2.1.1
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/hdf5-install -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DHDF5_ENABLE_ZLIB_SUPPORT=ON ..
          make -j$(nproc)
          make install

      - name: Cache NetCDF-C install
        id: cache-netcdf-c-pdb
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/netcdf-c-install
          key: netcdf-c-4.10.1-hdf5-2.1.1-pdb-${{ runner.os }}-refresh-1

      - name: Download and build NetCDF-C 4.10.1
        if: steps.cache-netcdf-c-pdb.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/Unidata/netcdf-c/archive/v4.10.1.tar.gz -O netcdf-c-4.10.1.tar.gz
          tar -xzf netcdf-c-4.10.1.tar.gz
          cd netcdf-c-4.10.1
          export PATH="$GITHUB_WORKSPACE/hdf5-install/bin:$PATH"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/hdf5-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/hdf5-install/lib"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$LD_LIBRARY_PATH"
          ./configure --prefix=$GITHUB_WORKSPACE/netcdf-c-install --enable-netcdf-4 --enable-shared --disable-dap
          make -j$(nproc)
          make install

      - name: Cache NetCDF-Fortran install
        id: cache-netcdf-fortran-pdb
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/netcdf-fortran-install
          key: netcdf-fortran-main-hdf5-2.1.1-netcdf-c-4.10.1-pdb-${{ runner.os }}-refresh-1

      - name: Clone and build NetCDF-Fortran (main branch)
        if: steps.cache-netcdf-fortran-pdb.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Unidata/netcdf-fortran.git netcdf-fortran-main
          cd netcdf-fortran-main
          autoreconf -if
          export PATH="$GITHUB_WORKSPACE/hdf5-install/bin:$GITHUB_WORKSPACE/netcdf-c-install/bin:$PATH"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/hdf5-install/include -I$GITHUB_WORKSPACE/netcdf-c-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/hdf5-install/lib -L$GITHUB_WORKSPACE/netcdf-c-install/lib"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$LD_LIBRARY_PATH"
          ./configure --prefix=$GITHUB_WORKSPACE/netcdf-fortran-install
          make -j$(nproc)
          make install

      # --- CMake build ---
      - name: Configure with CMake and PDB enabled
        run: |
          mkdir -p build && cd build
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/netcdf-c-install/lib/pkgconfig:$GITHUB_WORKSPACE/hdf5-install/lib/pkgconfig:${PKG_CONFIG_PATH}"
          cmake .. \
            -DCMAKE_C_FLAGS="-Wall -Werror" \
            -DCMAKE_Fortran_FLAGS="-Wall -Werror" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/hdf5-install;$GITHUB_WORKSPACE/netcdf-c-install;$GITHUB_WORKSPACE/netcdf-fortran-install" \
            -DNEP_ENABLE_PDB=ON \
            -DNEP_ENABLE_FORTRAN=ON \
            -DNEP_ENABLE_FITS=OFF \
            -DNEP_ENABLE_GRIB2=OFF \
            -DNEP_ENABLE_CDF=OFF \
            -DNEP_ENABLE_GEOTIFF=OFF \
            -DNEP_ENABLE_PDS4=OFF \
            -DNEP_ENABLE_DICOM=OFF \
            -DNEP_BUILD_LZ4=OFF \
            -DNEP_BUILD_BZIP2=OFF \
            -DNEP_BUILD_DOCUMENTATION=OFF \
            -DNEP_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=ON
          echo "=== Checking config.h for HAVE_PDB ==="
          grep "define HAVE_PDB" config.h && echo "SUCCESS: HAVE_PDB is defined" || (echo "FAILURE: HAVE_PDB not defined"; exit 1)

      - name: Build (CMake)
        working-directory: build
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/netcdf-fortran-install/lib:$LD_LIBRARY_PATH"
          make -j$(nproc)

      - name: Test (CMake)
        working-directory: build
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/netcdf-fortran-install/lib:$LD_LIBRARY_PATH"
          ctest --verbose

      - name: Summary
        if: always()
        run: |
          echo "=== PDB CI Build Summary ==="
          echo "Build System: CMake"
          echo "HDF5: 2.1.1"
          echo "NetCDF-C: 4.10.1"
          echo "NetCDF-Fortran: main"
          echo "External parsing library: none required"
