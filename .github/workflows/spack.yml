name: Spack CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  style:
    runs-on: ubuntu-latest
    name: style
    steps:
      - uses: actions/checkout@v4

      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_path: .ci-spack
          packages_path: .ci-spack-packages
          spack_ref: v1.2.2
          packages_ref: v2026.10.0
          buildcache: true

      - name: Install style tools
        run: pip install ruff==0.15.11 vermin==1.8.0

      - name: Check style
        run: |
          set -euo pipefail
          recipe="${GITHUB_WORKSPACE}/spack/repos/spack_repo/nep/packages/nep/package.py"
          cd .ci-spack-packages
          ruff format --diff "${recipe}"
          ruff check --no-fix "${recipe}"
          vermin --backport importlib --backport argparse --violations --backport typing --eval-annotations -t=3.6- -vvv "${recipe}"

  spack:
    runs-on: ubuntu-latest
    name: spack
    steps:
      - uses: actions/checkout@v4

      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          # The default ./spack would overwrite this repo's spack/ directory.
          spack_path: .ci-spack
          packages_path: .ci-spack-packages
          spack_ref: v1.2.2
          packages_ref: v2026.10.0
          buildcache: true

      - name: Audit package
        shell: spack-bash {0}
        run: |
          set -euo pipefail
          spack -e spack/ci repo list
          spack audit packages nep

      - name: Check specs
        shell: spack-bash {0}
        run: |
          set -euo pipefail
          spack repo add spack/repos/spack_repo/nep
          spack spec nep@4.2.0 ^netcdf-c@main
          spack spec nep@main+docs+parallel ^netcdf-c@main+mpi ^mpich

      - name: Concretize
        shell: spack-bash {0}
        run: |
          set -euo pipefail
          spack compiler find
          spack -e spack/ci concretize -f
          spack -e spack/ci find -c

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/spack
          key: spack-deps-${{ hashFiles('spack/ci/spack.lock') }}
          restore-keys: spack-deps-

      - name: Install dependencies
        shell: spack-bash {0}
        run: spack -e spack/ci install --fail-fast --only dependencies

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/spack
          key: spack-deps-${{ hashFiles('spack/ci/spack.lock') }}

      - name: Build and test nep
        shell: spack-bash {0}
        run: |
          set -euo pipefail
          spack -e spack/ci install --test=root --verbose nep
          prefix="$(spack -e spack/ci location -i nep)"
          log="${RUNNER_TEMP}/spack-build-out.txt"
          gzip -dc "${prefix}/.spack/spack-build-out.txt.gz" > "${log}"
          test -f "${prefix}/lib/libncmmcif.so"
          test -f "${prefix}/lib/libncnextcdf4.so"
          test -f "${prefix}/share/.ncrc"
          grep -q 'tst_mmcif_udf' "${log}"
          grep -q 'tst_pdb_udf' "${log}"
          grep -q 'ftst_pdb_udf' "${log}"

      - name: Upload Spack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spack-logs
          path: |
            /opt/spack/**/.spack/spack-build-*.txt*
            /tmp/runner/spack-stage/**/spack-build-*.txt*
