# Conda package workflow for NEP.
#
# Builds and tests the v1 rattler-build recipe in conda/recipe/ against
# conda-forge pinnings, and lints the staged-recipes copy generated by
# conda/make_staged_recipe.py.
#
# Edward Hartnett, Intelligent Data Design, Inc., Nov 5, 2026

name: Conda package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conda:
    runs-on: ubuntu-latest
    name: conda
    steps:
      - uses: actions/checkout@v4

      - name: Fetch conda-forge pinnings
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/conda_build_config.yaml" \
            https://raw.githubusercontent.com/conda-forge/conda-forge-pinning-feedstock/main/recipe/conda_build_config.yaml

      - name: Build and test the recipe
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: conda/recipe/recipe.yaml
          build-args: >-
            -m ${{ runner.temp }}/conda_build_config.yaml
            --output-dir ${{ runner.temp }}/conda-out
          upload-artifact: false

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lint
          create-args: conda-smithy
          init-shell: bash

      - name: Lint the staged-recipes copy
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python3 conda/make_staged_recipe.py 4.2.0 \
            18656ce4f7095f3e52234645224144d2558ff001a7444fcc9b6ed7b7e718eccd \
            "${RUNNER_TEMP}/staged"
          conda-smithy recipe-lint --conda-forge "${RUNNER_TEMP}/staged/recipes/nep"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nep-conda
          path: ${{ runner.temp }}/conda-out/**/*.conda
