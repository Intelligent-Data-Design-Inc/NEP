# GitHub Actions CI workflow for building and testing the NEP project with CMake.
#
# NEP CI Pipeline - v1.3.0 Configuration
#
# v1.3.0 Scope: LZ4/BZIP2 Compression + CDF Library Detection
# This CI configuration includes LZ4/BZIP2 compression for HDF5/NetCDF-4 files
# and adds NASA CDF library detection (library location only, no UDF yet).
#
# Compiler Warnings (Issue #86):
# CMake builds automatically add -Wall -Werror flags for GNU compilers,
# ensuring builds fail on compiler warnings.
#
#
# Edward Hartnett, Intelligent Data Design, Inc., Nov 13, 2025
name: ci_main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # GRIB2 UDF handler build and test - v1.7.0 Sprint 1
  # DISABLED: Waiting for Jasper build fix
  grib2-build:
    if: false
    name: GRIB2 Build (CMake)
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: $GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/g2c-install/lib:$LD_LIBRARY_PATH
      PKG_CONFIG_PATH: ${{ github.workspace }}/netcdf-c-install/lib/pkgconfig:${{ github.workspace }}/hdf5-install/lib/pkgconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make wget zlib1g-dev pkg-config libpng-dev

      - name: Cache HDF5 install
        id: cache-hdf5-grib2
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/hdf5-install
          key: hdf5-2.1.1-${{ runner.os }}-refresh-1

      - name: Download and build HDF5 2.1.1
        if: steps.cache-hdf5-grib2.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/2.1.1.tar.gz -O hdf5-2.1.1.tar.gz
          tar -xzf hdf5-2.1.1.tar.gz
          cd hdf5-2.1.1
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/hdf5-install -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DHDF5_ENABLE_ZLIB_SUPPORT=ON ..
          make -j$(nproc)
          make install

      - name: Cache NetCDF-C install
        id: cache-netcdf-c-grib2
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/netcdf-c-install
          key: netcdf-c-4.10.1-hdf5-2.1.1-${{ runner.os }}-refresh-1

      - name: Download and build NetCDF-C
        if: steps.cache-netcdf-c-grib2.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/Unidata/netcdf-c/archive/v4.10.1.tar.gz &> /dev/null
          tar -xzf v4.10.1.tar.gz
          cd netcdf-c-4.10.1
          export PATH="$GITHUB_WORKSPACE/hdf5-install/bin:$PATH"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/hdf5-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/hdf5-install/lib"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$LD_LIBRARY_PATH"
          ./configure --prefix=$GITHUB_WORKSPACE/netcdf-c-install --enable-netcdf-4 --enable-shared --disable-dap
          make -j$(nproc)
          make install

      - name: Cache Jasper install
        id: cache-jasper
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/jasper-install
          key: jasper-4.2.4-${{ runner.os }}-refresh-1

      - name: Download and build Jasper 4.2.4
        if: steps.cache-jasper.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch version-4.2.4 https://github.com/jasper-software/jasper.git jasper-4.2.4
          # Build outside the source tree; Jasper's build/cmake/modules directory
          # contains required CMake modules and must not be removed.
          mkdir jasper-build && cd jasper-build
          cmake -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/jasper-install \
                -DBUILD_SHARED_LIBS=ON \
                -DJAS_ENABLE_DOC=OFF \
                -DJAS_ENABLE_PROGRAMS=OFF \
                $GITHUB_WORKSPACE/jasper-4.2.4
          make -j$(nproc)
          make install
          echo "=== Jasper installation ==="
          ls -l $GITHUB_WORKSPACE/jasper-install/lib/ || true
          ls -l $GITHUB_WORKSPACE/jasper-install/include/ || true

      - name: Cache g2c install
        id: cache-g2c
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/g2c-install
          key: g2c-2.3.0-${{ runner.os }}-refresh-1

      - name: Download and build NCEPLIBS-g2c 2.3.0
        if: steps.cache-g2c.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/NOAA-EMC/NCEPLIBS-g2c/archive/refs/tags/v2.3.0.tar.gz &> /dev/null
          tar -xzf v2.3.0.tar.gz
          cd NCEPLIBS-g2c-2.3.0
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/g2c-install \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_TESTING=OFF \
                -DBUILD_DOCS=OFF \
                ..
          make -j$(nproc)
          make install
          echo "=== g2c installation ==="
          ls -l $GITHUB_WORKSPACE/g2c-install/lib/ || true
          ls -l $GITHUB_WORKSPACE/g2c-install/include/ || true

      # --- CMake build with GRIB2 ---
      - name: Configure with CMake and GRIB2 enabled
        run: |
          mkdir -p build
          cd build
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/netcdf-c-install/lib/pkgconfig:$GITHUB_WORKSPACE/hdf5-install/lib/pkgconfig:${PKG_CONFIG_PATH}"
          cmake .. \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/hdf5-install;$GITHUB_WORKSPACE/netcdf-c-install;$GITHUB_WORKSPACE/g2c-install" \
            -DNEP_ENABLE_GRIB2=ON \
            -DNEP_ENABLE_FORTRAN=OFF \
            -DNEP_ENABLE_CDF=OFF \
            -DNEP_ENABLE_GEOTIFF=OFF \
            -DBUILD_TESTING=ON \
            -DNEP_BUILD_LZ4=OFF \
            -DNEP_BUILD_BZIP2=OFF \
            -DNEP_ENABLE_FITS=OFF \
            -DNEP_BUILD_DOCUMENTATION=OFF
          echo "=== Checking config.h for HAVE_GRIB2 ==="
          grep "define HAVE_GRIB2" config.h && echo "SUCCESS: HAVE_GRIB2 is defined" || (echo "FAILURE: HAVE_GRIB2 not defined"; exit 1)

      - name: Build (CMake)
        working-directory: build
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/g2c-install/lib:$LD_LIBRARY_PATH"
          make -j$(nproc)

      - name: Test (CMake)
        working-directory: build
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/g2c-install/lib:$LD_LIBRARY_PATH"
          ctest --verbose -R tst_grib2_udf

      - name: Summary
        if: always()
        run: |
          echo "=== GRIB2 Build Test Summary ==="
          echo "Build System: CMake"
          echo "g2c version: 2.3.0"

  build:
    name: build (CMake, Fortran ${{ matrix.fortran }}, compression ${{ matrix.compression }})
    runs-on: ubuntu-latest
    env:
      HDF5_PLUGIN_PATH: ${{ github.workspace }}/netcdf-c-install/hdf5/lib/plugin
      LD_LIBRARY_PATH: $GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/netcdf-fortran-install/lib:$GITHUB_WORKSPACE/cdf-install/lib:$GITHUB_WORKSPACE/libdicom-install/lib:$LD_LIBRARY_PATH
      PKG_CONFIG_PATH: ${{ github.workspace }}/netcdf-c-install/lib/pkgconfig:${{ github.workspace }}/hdf5-install/lib/pkgconfig:${{ github.workspace }}/libdicom-install/lib/pkgconfig:${{ github.workspace }}/libdicom-install/lib/x86_64-linux-gnu/pkgconfig
    strategy:
      fail-fast: false
      matrix:
        fortran: [on, off]
        compression: [all, no-bzip2, no-lz4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get install -y cmake make wget zlib1g-dev libjpeg-dev libjpeg-turbo8-dev liblz4-dev libbz2-dev liblzf-dev libzstd-dev meson ninja-build

      - name: Install documentation dependencies
        if: matrix.fortran == 'on' && matrix.compression == 'all'
        run: |
          sudo apt-get install -y doxygen graphviz

      # Cache NASA CDF install (v1.3.0+)
      - name: Cache NASA CDF install
        id: cache-cdf
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cdf-install
          key: cdf-3.9.1-${{ runner.os }}-refresh-1

      - name: Download and build NASA CDF library
        if: steps.cache-cdf.outputs.cache-hit != 'true'
        run: |
          wget https://spdf.gsfc.nasa.gov/pub/software/cdf/dist/cdf39_1/cdf39_1-dist-cdf.tar.gz &> /dev/null
          tar -xzf cdf39_1-dist-cdf.tar.gz
          cd cdf39_1-dist
          make OS=linux ENV=gnu all
          make INSTALLDIR=$GITHUB_WORKSPACE/cdf-install install
          echo "CDF installation contents:"
          ls -la $GITHUB_WORKSPACE/cdf-install/
          ls -la $GITHUB_WORKSPACE/cdf-install/lib/ || true
          echo "Checking for CDF library files:"
          find $GITHUB_WORKSPACE/cdf-install -name "*cdf*" -o -name "*.a" -o -name "*.so*" || true

      - name: Verify CDF installation
        run: |
          echo "=== CDF Installation Verification ==="
          echo "Installation directory structure:"
          ls -la $GITHUB_WORKSPACE/cdf-install/ || echo "cdf-install directory not found"
          echo "Library directory contents:"
          ls -la $GITHUB_WORKSPACE/cdf-install/lib/ || echo "lib directory not found"
          echo "Include directory contents:"
          ls -la $GITHUB_WORKSPACE/cdf-install/include/ || echo "include directory not found"
          echo "All CDF-related files:"
          find $GITHUB_WORKSPACE/cdf-install -type f 2>/dev/null || echo "No files found"

      - name: Cache HDF5 install
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/hdf5-install
          key: hdf5-2.1.1-${{ runner.os }}-refresh-1
      
      - name: Download and build HDF5 2.1.1
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        id: build-hdf5
        run: |
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/2.1.1.tar.gz -O hdf5-2.1.1.tar.gz
          tar -xzf hdf5-2.1.1.tar.gz
          ls -l
          cd hdf5-2.1.1
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/hdf5-install -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DHDF5_ENABLE_ZLIB_SUPPORT=ON ..
          make -j$(nproc)
          make install

      # Cache NetCDF-C install
      - name: Cache NetCDF-C install
        id: cache-netcdf-c
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/netcdf-c-install
          key: netcdf-c-4.10.1-hdf5-2.1.1-${{ runner.os }}-refresh-1

      - name: Download and build NetCDF-C
        if: steps.cache-netcdf-c.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/Unidata/netcdf-c/archive/v4.10.1.tar.gz &> /dev/null
          tar -xzf v4.10.1.tar.gz
          cd netcdf-c-4.10.1
          export PATH="$GITHUB_WORKSPACE/hdf5-install/bin:$PATH"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/hdf5-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/hdf5-install/lib"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$LD_LIBRARY_PATH"
          ./configure --prefix=$GITHUB_WORKSPACE/netcdf-c-install --enable-netcdf-4 --enable-shared --disable-dap
          make -j$(nproc)
          make install

      - name: Download and build hdf5_plugins
        if: steps.cache-netcdf-c.outputs.cache-hit != 'true'
        run: |
          export HDF5_PLUGIN_PATH=$GITHUB_WORKSPACE/netcdf-c-install/hdf5/lib/plugin
          export PATH="$GITHUB_WORKSPACE/hdf5-install/bin:$PATH"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/hdf5-install/include -I/usr/include/liblzf"
          export LDFLAGS="-L$GITHUB_WORKSPACE/hdf5-install/lib"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$LD_LIBRARY_PATH"
          # Clone and build hdf5_plugins
          rm -rf hdf5_plugins
          git clone https://github.com/captainkirk99/hdf5_plugins hdf5_plugins
          pushd hdf5_plugins
          git checkout e1
          autoreconf -i
          ./configure --with-hdf5-plugin-path=$HDF5_PLUGIN_PATH --prefix=$GITHUB_WORKSPACE/netcdf-c-install 
          make 
          make install
          ls -l $GITHUB_WORKSPACE/netcdf-c-install
          ls -l $HDF5_PLUGIN_PATH
          popd

      # Cache NetCDF-Fortran install
      - name: Cache NetCDF-Fortran install
        id: cache-netcdf-fortran
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/netcdf-fortran-install
          key: netcdf-fortran-4.6.2-hdf5-2.1.1-netcdf-c-4.10.1-${{ runner.os }}-refresh-1

      - name: Download and build NetCDF-Fortran
        if: steps.cache-netcdf-fortran.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/Unidata/netcdf-fortran/archive/v4.6.2.tar.gz &> /dev/null
          tar -xzf v4.6.2.tar.gz
          cd netcdf-fortran-4.6.2
          export PATH="$GITHUB_WORKSPACE/hdf5-install/bin:$GITHUB_WORKSPACE/netcdf-c-install/bin:$PATH"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/hdf5-install/include -I$GITHUB_WORKSPACE/netcdf-c-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/hdf5-install/lib -L$GITHUB_WORKSPACE/netcdf-c-install/lib"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$LD_LIBRARY_PATH"
          ./configure --prefix=$GITHUB_WORKSPACE/netcdf-fortran-install
          make -j$(nproc)
          make install

      # Cache libdicom install for DICOM-enabled builds
      - name: Cache libdicom install
        if: matrix.fortran == 'on' && matrix.compression == 'all'
        id: cache-libdicom
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/libdicom-install
          key: libdicom-main-ci-${{ runner.os }}-refresh-1

      - name: Clone and build libdicom
        if: matrix.fortran == 'on' && matrix.compression == 'all' && steps.cache-libdicom.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ImagingDataCommons/libdicom.git libdicom-main
          cd libdicom-main
          meson setup build --prefix=$GITHUB_WORKSPACE/libdicom-install
          meson compile -C build
          meson install -C build

            # --- CMake build ---------------------------------------------------
      - name: Create build directory (CMake)
        run: mkdir -p build

      - name: Configure with CMake and custom HDF5
        working-directory: build
        run: |
          echo "Building NEP v1.3.0 - LZ4/BZIP2 compression + CDF library detection"
          DOC_FLAG="-DNEP_BUILD_DOCUMENTATION=OFF"
          if [ "${{ matrix.fortran }}" = "on" ] && [ "${{ matrix.compression }}" = "all" ]; then
            DOC_FLAG="-DNEP_BUILD_DOCUMENTATION=ON"
          fi
          FORTRAN_FLAG="-DNEP_ENABLE_FORTRAN=ON"
          if [ "${{ matrix.fortran }}" = "off" ]; then
            FORTRAN_FLAG="-DNEP_ENABLE_FORTRAN=OFF"
          fi
          CDF_FLAG="-DNEP_ENABLE_CDF=OFF"
          if [ "${{ matrix.fortran }}" = "on" ]; then
            CDF_FLAG="-DNEP_ENABLE_CDF=ON"
          fi
          DICOM_FLAG="-DNEP_ENABLE_DICOM=OFF"
          if [ "${{ matrix.fortran }}" = "on" ] && [ "${{ matrix.compression }}" = "all" ]; then
            DICOM_FLAG="-DNEP_ENABLE_DICOM=ON"
          fi
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/netcdf-c-install/lib/pkgconfig:$GITHUB_WORKSPACE/hdf5-install/lib/pkgconfig:${PKG_CONFIG_PATH}"
          cmake .. -DCMAKE_C_FLAGS="-Wall -Werror" -DCMAKE_Fortran_FLAGS="-Wall -Werror" -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/hdf5-install;$GITHUB_WORKSPACE/netcdf-c-install;$GITHUB_WORKSPACE/netcdf-fortran-install;$GITHUB_WORKSPACE/cdf-install;$GITHUB_WORKSPACE/libdicom-install;/usr/include/liblzf" -DBUILD_TESTING=ON -DNEP_BUILD_EXAMPLES=ON $DOC_FLAG $FORTRAN_FLAG $CDF_FLAG $DICOM_FLAG -DNEP_ENABLE_FITS=OFF -DNEP_ENABLE_GEOTIFF=OFF -DNEP_ENABLE_GRIB2=OFF

      - name: Build (CMake)
        working-directory: build
        run: |
          set -x
          pwd
          ls -l
          echo "Building with CMake..."
          export PATH=$GITHUB_WORKSPACE/hdf5-install/bin:$PATH
          export HDF5_PLUGIN_PATH=$GITHUB_WORKSPACE/netcdf-c-install/hdf5/lib/plugin
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/netcdf-fortran-install/lib:$GITHUB_WORKSPACE/libdicom-install/lib:$LD_LIBRARY_PATH
          make -j$(nproc)

      - name: Build Documentation (CMake)
        if: matrix.fortran == 'on' && matrix.compression == 'all'
        working-directory: build
        run: |
          set -x
          pwd
          ls -l
          echo "Building documentation with CMake..."
          make docs 2>&1 | tee doc_build.log
          # Check for warnings in documentation build
          if grep -i "warning" doc_build.log; then
            echo "Documentation build contains warnings - failing build"
            exit 1
          fi
          echo "Documentation built successfully without warnings"

      - name: Test (CTest)
        working-directory: build
        run: |
          export PATH="$GITHUB_WORKSPACE/hdf5-install/bin:$PATH"
          export HDF5_PLUGIN_PATH="$GITHUB_WORKSPACE/netcdf-c-install/hdf5/lib/plugin"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/hdf5-install/include -I$GITHUB_WORKSPACE/netcdf-c-install/include -I$GITHUB_WORKSPACE/netcdf-fortran-install/include -I$GITHUB_WORKSPACE/cdf-install/include -I/usr/include/liblzf"
          export LDFLAGS="-L$GITHUB_WORKSPACE/hdf5-install/lib -L$GITHUB_WORKSPACE/netcdf-c-install/lib -L$GITHUB_WORKSPACE/netcdf-fortran-install/lib -L$GITHUB_WORKSPACE/cdf-install/lib"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/hdf5-install/lib:$GITHUB_WORKSPACE/netcdf-c-install/lib:$GITHUB_WORKSPACE/netcdf-fortran-install/lib:$GITHUB_WORKSPACE/cdf-install/lib:$GITHUB_WORKSPACE/libdicom-install/lib:$LD_LIBRARY_PATH"
          ctest --verbose
          sudo make install

      - name: Upload Documentation Artifacts (CMake)
        if: matrix.fortran == 'on' && matrix.compression == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-cmake-lz4
          path: build/docs/html/
          retention-days: 30
