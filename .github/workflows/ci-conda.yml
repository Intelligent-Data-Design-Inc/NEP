# Conda CI workflow for NEP package validation
#
# This workflow validates the NEP Conda recipe by building the package
# using conda-build on Ubuntu.
#
# Edward Hartnett, Intelligent Data Design, Inc.

name: Conda CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  conda-build:
    name: Conda Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout NEP
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Install conda-build
        run: |
          conda install -y conda-build
          conda-build --version

      - name: Render and validate Conda recipe
        run: |
          conda-build --output conda/
          conda-build --check conda/

      - name: Build NEP Conda package
        run: |
          set -o pipefail
          conda-build conda/ --no-anaconda-upload 2>&1 | tee conda_build.log

      - name: Verify and smoke-test package
        run: |
          PKG_PATH=$(conda-build conda/ --output)
          echo "Package: $PKG_PATH"
          test -f "$PKG_PATH"
          conda create -y -p "$RUNNER_TEMP/nep-smoke" "$PKG_PATH"
          test -f "$RUNNER_TEMP/nep-smoke/lib/plugin/libh5lz4.so"
          test -f "$RUNNER_TEMP/nep-smoke/include/nep.mod"

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== Last 200 lines of conda build log ==="
          tail -200 conda_build.log || true
