{% set version = "4.2.0.dev0" %}

package:
  name: nep
  version: {{ version }}

source:
  # Build the format-only checkout until v4.2.0 has a release tarball.
  path: ..

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('nep', max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - cmake >=3.9
    - make
    - pkg-config
  host:
    - hdf5 >=1.14
    - libnetcdf >=4.10.1
    - netcdf-fortran
  run:
    - hdf5
    - libnetcdf
    - netcdf-fortran

test:
  commands:
    - test -f $PREFIX/include/nep.h
    - test -f $PREFIX/lib/libncpdb.so                   # [linux]
    - test -f $PREFIX/lib/libncpdb.dylib                # [osx]

about:
  home: https://github.com/Intelligent-Data-Design-Inc/NEP
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: >
    NEP adds scientific format readers and the NEXTCDF-4 backend to NetCDF-C.
  description: >
    NEP (NetCDF Expansion Pack) provides scientific format readers through
    the NetCDF User Defined Format API. For LZ4/BZIP2 use nep-compress.
  dev_url: https://github.com/Intelligent-Data-Design-Inc/NEP

extra:
  recipe-maintainers:
    - edhartnett
